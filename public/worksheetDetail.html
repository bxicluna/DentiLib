<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Détail fiche de travaux</title>
    <link rel="stylesheet" href="./styles/admin.css" />
    <link rel="stylesheet" href="./styles/worksheetDetail.css" />
  </head>
  <body>
    <!-- ===== HEADER ===== -->
    <header class="admin-header">
      <div class="admin-name">DentiLib</div>
      <div class="header-actions">
        <button class="btn" id="btnBack">Retour</button>
        <button class="btn btn-logout" id="logout">Déconnexion</button>
      </div>
    </header>

    <!-- ===== MAIN ===== -->
    <main>
      <div class="admin-container worksheet-detail">
        <h2>Fiche de travaux</h2>

        <!-- ===== INFOS PATIENT / PROTHÉSISTE ===== -->
        <div class="worksheet-info">
          <!-- Ligne Numéro de fiche / Date -->
          <div class="form-row">
            <div class="form-group">
              <label>Numéro de fiche</label>
              <input type="text" id="numWorkSheet" readonly />
            </div>
            <div class="form-group">
              <label>Date de création</label>
              <input type="text" id="createdAt" readonly />
            </div>
          </div>

          <!-- Ligne Nom / Prénom / Numéro de sécu -->
          <div class="form-row">
            <div class="form-group">
              <label>Prénom du patient</label>
              <input
                type="text"
                id="patientFirstName"
                class="editable"
                readonly
              />
            </div>
            <div class="form-group">
              <label>Nom du patient</label>
              <input
                type="text"
                id="patientLastName"
                class="editable"
                readonly
              />
            </div>
            <div class="form-group">
              <label>Numéro de sécurité sociale</label>
              <input
                type="text"
                id="patientNumSecu"
                class="editable"
                readonly
              />
            </div>
          </div>

          <!-- Email -->
          <div class="form-group">
            <label>Email du patient</label>
            <input type="email" id="patientEmail" class="editable" readonly />
          </div>

          <!-- Prothésiste -->
          <div class="form-group">
            <label>Prothésiste</label>
            <input type="text" id="prothesisteName" readonly />
          </div>
        </div>

        <!-- ===== ACTES ===== -->
        <div class="worksheet-actes">
          <h3 style="margin-bottom: 1rem; color: #38bdf8">Actes réalisés</h3>
          <div id="actesContainer"></div>
          <button type="button" class="btn" id="addActeBtn">
            Ajouter un acte
          </button>
        </div>

        <!-- ===== COMMENTAIRE ===== -->
        <div class="form-group" style="margin-top: 1.5rem">
          <label>Commentaire</label>
          <textarea
            id="comment"
            rows="2"
            b
            class="editable"
            readonly
          ></textarea>
        </div>

        <!-- ===== TOTAL ET STATUT ===== -->
        <div class="bottom-row">
          <div class="status-container">
            <select id="statusSelect">
              <option value="En attente">En attente</option>
              <option value="En cours">En cours</option>
              <option value="Termine">Terminé</option>
            </select>
          </div>
          <div class="fiche-total">
            Total : <span id="totalAmount">0</span> €
          </div>
        </div>

        <div id="messageSystem" class="message-modal"></div>

        <!-- ===== ACTIONS ===== -->
        <div class="form-actions worksheet-actions">
          <button id="btnSave" class="btn btn-edit">Sauvegarder</button>
          <button id="btnDelete" class="btn btn-delete">Supprimer</button>
        </div>
      </div>
    </main>

    <!-- ===== FOOTER ===== -->
    <footer>© 2025 DentiLib – Tous droits réservés</footer>

    <script src="./js/worksheetDetail.js"></script>
  </body>
</html>
