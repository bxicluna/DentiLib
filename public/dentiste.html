<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Espace Dentiste</title>
    <link rel="stylesheet" href="./styles/admin.css" />
    <link rel="stylesheet" href="./styles/dentiste.css" />
  </head>
  <body>
    <!-- ===== HEADER ===== -->
    <header class="admin-header">
      <div class="admin-name" id="dentistName">👩‍⚕️</div>
      <div class="header-actions">
        <button class="btn btn-logout" id="logout">Déconnexion</button>
      </div>
    </header>

    <!-- ===== MAIN ===== -->
    <main>
      <div class="admin-container" id="dentisteContainer">
        <div
          style="
            display: flex;
            justify-content: space-between;
            margin-bottom: 1.5rem;
          "
        >
          <h2 style="color: #38bdf8">Mes fiches de travaux</h2>
          <button class="btn btn-detail" id="btnOpenCreate">
            + Nouvelle fiche
          </button>
        </div>
        <div id="messageSystem" class="message-system"></div>

        <!-- ===== FILTERS ===== -->
        <div class="filters">
          <input type="text" placeholder="Patient (nom / prénom)" />
          <select>
            <option value="">Tous les statuts</option>
            <option value="en attente">En attente</option>
            <option value="en cours">En cours</option>
            <option value="termine">Terminé</option>
          </select>
          <input type="date" />
        </div>

        <!-- ===== TABLE ===== -->
        <div class="dentiste-table-wrapper">
          <table>
            <thead>
              <tr>
                <th>N° Fiche</th>
                <th>Patient</th>
                <th>Date</th>
                <th>Prothésiste</th>
                <th>Statut</th>
                <th>Total (€)</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="dentisteTableBody">
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <!-- ===== MODAL CREATION FICHE ===== -->
    <div class="modal" id="createModal">
      <div class="modal-content">
        <span class="close-modal" id="closeAddWorksheetModal">&times;</span>
        <h2>Créer une fiche de travaux</h2>

        <form id="createWorksheetForm">
          <!-- Infos patient -->
          <div class="patient-row">
            <div class="form-group">
              <label>Prénom du patient</label>
              <input
                type="text"
                id="patientFirstName"
                name="patientFirstName"
                required
              />
            </div>
            <div class="form-group">
              <label>Nom du patient</label>
              <input
                type="text"
                id="patientLastName"
                name="patientLastName"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label>Email du patient</label>
            <input
              type="email"
              id="patientEmail"
              name="patientEmail"
              required
            />
          </div>

          <div class="form-group">
            <label>Numéro de sécurité sociale</label>
            <input
              type="number"
              id="patientNumSecu"
              name="patientNumSecu"
              required
            />
          </div>

          <!-- Prothésiste (pré-rempli, readonly) -->
          <div class="form-group">
            <label>Prothésiste</label>
            <span id="prothesisteName" class="readonly-field"></span>
          </div>

          <!-- Liste des actes -->
          <div id="actesContainer"></div>
          <button type="button" class="btn" id="addActeBtn">
            Ajouter un acte
          </button>

          <!-- Commentaire -->
          <div class="form-group">
            <label>Commentaire</label>
            <textarea id="comment" name="comment" rows="2"></textarea>
          </div>

          <!-- Total -->
          <div class="fiche-total">
            Total : <span id="totalAmount">0</span> €
          </div>

          <div id="messageModal" class="message-modal"></div>

          <!-- Actions -->
          <div class="form-actions">
            <button type="button" class="btn" id="cancelAddWorksheet">
              Annuler
            </button>
            <button
              type="submit"
              class="btn btn-detail"
              id="createWorksheetBtn"
            >
              Créer
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- ===== FOOTER ===== -->
    <footer>© 2025 – Application Fiches Dentaires</footer>
    <script src="/js/dentiste.js"></script>
  </body>
</html>
