<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Admin - Actes</title>
    <link rel="stylesheet" href="styles/admin.css" />
    <link rel="stylesheet" href="styles/actes.css" />
  </head>

  <body>
    <!-- MODALE AJOUT / MODIF ACTE -->
    <div class="modal" id="acteModal">
      <div class="modal-content">
        <span class="close-modal" id="closeActeModal">&times;</span>

        <h2 id="acteModalTitle">Ajouter un acte</h2>

        <form id="acteForm">
          <div class="form-group">

            <input type="hidden" id="acteId" />

            <label for="acteName">Nom de l’acte</label>
            <input type="text" id="acteName" required />
          </div>

          <div class="form-group">
            <label for="acteDescription">Description</label>
            <input type="text" id="acteDescr"/>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn">Enregistrer</button>
            <button type="button" class="btn btn-logout" id="cancelActe">
              Annuler
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- HEADER -->
    <header class="admin-header">
      <div class="admin-name">Liste des actes</div>

      <div class="header-actions">
        <button class="btn" id="openActeModal">Ajouter un acte</button>
        <button class="btn" id="backAdmin">Liste des utilisateurs</button>
      </div>
    </header>

    <!-- CONTENU -->
    <main>
      <section class="admin-container">
      <!--<div class="filters">
          <input
            id="searchActe"
            type="text"
            placeholder="Rechercher un acte"
          />
        </div>-->

        <table>
          <thead>
            <tr>
              <th>Nom</th>
              <th>Description</th>
            </tr>
          </thead>
          <tbody id="acteTableBody"></tbody>
        </table>
      </section>
    </main>

    <footer>© 2025 DentiLib</footer>

    <script src="/js/actes.js"></script>
  </body>
</html>
