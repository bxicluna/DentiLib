<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Espace Prothésiste</title>
    <link rel="stylesheet" href="./styles/admin.css" />
    <link rel="stylesheet" href="./styles/prothesiste.css" />
  </head>
  <body>
    <!-- ===== HEADER ===== -->
    <header class="admin-header">
      <div class="admin-name" id="prothesisteName">🦷</div>
      <div class="header-actions">
        <button class="btn btn-catalogue" id="catalogue">
          Gérer mon catalogue
        </button>
        <button class="btn btn-logout" id="logout">Déconnexion</button>
      </div>
    </header>

    <!-- ===== MAIN ===== -->
    <main>
      <div class="admin-container" id="prothesisteContainer">
        <h2 style="color: #38bdf8; margin-bottom: 1.5rem">
          Mes fiches de travaux
        </h2>

        <!-- ===== FILTERS ===== -->
        <div class="filters">
          <input type="text" placeholder="Patient (nom / prénom)" />
          <select>
            <option value="">Tous les statuts</option>
            <option value="en attente">En attente</option>
            <option value="en cours">En cours</option>
            <option value="termine">Terminé</option>
          </select>
          <input type="date" />
        </div>

        <!-- ===== TABLE ===== -->
        <div class="prothesiste-table-wrapper">
          <table>
            <thead>
              <tr>
                <th>N° Fiche</th>
                <th>Patient</th>
                <th>Dentiste</th>
                <th>Date</th>
                <th>Statut</th>
                <th>Total (€)</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="prothesisteTableBody"></tbody>
          </table>
        </div>
      </div>
    </main>

    <!-- ===== FOOTER ===== -->
    <footer>© 2025 – Application Fiches Dentaires</footer>

    <script src="/js/prothesiste.js"></script>
  </body>
</html>
